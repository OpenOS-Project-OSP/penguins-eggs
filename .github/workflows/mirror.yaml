name: Mirror to OpenOS-Project-OSP

on:
  push:
    branches: ["**"]
    tags: ["**"]
  schedule:
    # Hourly sync to catch any missed push events
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Changed from read to write
    steps:
      - name: Checkout full history (detached HEAD)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          # Detached HEAD avoids "refusing to fetch into checked-out branch"
          ref: ${{ github.sha }}

      - name: Fetch all branches and tags
        run: git fetch --all --tags --prune

      - name: Rewrite docs placeholder URLs for OSP
        run: |
          REPO_URL="https://gitlab.com/OSPF1896/penguins-eggs"
          find ./docs/chromiumos -name '*.md' | while read f; do
            sed -i \
              -e "s|{{REPO_BLOB}}|${REPO_URL}/blob/all-features|g" \
              -e "s|{{REPO_TREE}}|${REPO_URL}/tree/all-features|g" \
              "$f"
          done
          git config user.email "mirror-bot@github.com"
          git config user.name "Mirror Bot"
          git diff --quiet || git commit -am "chore: rewrite docs URLs for OpenOS-Project-OSP mirror"

      - name: Push mirror to OpenOS-Project-OSP
        env:
          GITHUB_TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: |
          git config --global credential.helper 'store --file ~/.git-credentials'
          echo "https://${GITHUB_TOKEN}:x-oauth-basic@github.com" > ~/.git-credentials
          git remote add mirror \
            "https://github.com/OpenOS-Project-OSP/penguins-eggs.git"
          git fetch mirror  # Fetch latest changes from the mirror
          git push mirror 'refs/remotes/origin/*:refs/heads/*' --force
          git push mirror --tags --force
          rm -f ~/.git-credentials